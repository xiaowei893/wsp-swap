# ==============================================================================
# wsp-swap 开发环境个性化配置 (Profile: dev)
# 激活方式: application.yml 中配置 spring.profiles.active: dev 或启动参数 --spring.profiles.active=dev
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Knife4j / Swagger 在线接口文档配置
# ------------------------------------------------------------------------------
springdoc:
  # 接口文档首页展示标题
  title: "一体化内外网部署数据交换平台"
  # 接口文档项目描述
  description: "交换部署数据处理平台"
  # 接口文档版本号
  version: "1.0.0"
  contact:
    name: "ZKJS"
    url: "https://zkjs.com"
    email: "dev@zkjs.com"
  swagger-ui:
    # 开发环境开启 Swagger 交互式调试 UI 页面 (在线访问地址: http://localhost:9980/swap/doc.html)
    enabled: true
  api-docs:
    # 开启 OpenAPI 规范元数据端点 (/v3/api-docs)
    enabled: true

# ------------------------------------------------------------------------------
# 2. 数据库连接池配置 (Druid 全局连接池 - 开发环境)
# ------------------------------------------------------------------------------
spring:
  datasource:
    dynamic:
      druid:
        # 初始物理连接数 (开发环境设置为较小值，加快本地启动速度)
        initial-size: 2
        # 最小空闲连接数 (连接池长期维持的常驻连接数)
        min-idle: 2
        # 最大并发连接数 (开发单机调试支持最大 15 个并发连接)
        max-active: 15
        # 从连接池借出连接时的最大等待超时时间 (单位: 毫秒，超时将抛出 GetConnectionTimeoutException)
        max-wait: 60000
        # 空闲连接检测与无效连接驱逐线程的运行周期 (单位: 毫秒，每隔 60 秒检测一次)
        time-between-eviction-runs-millis: 60000
        # 连接在池中保持空闲的最少时间 (单位: 毫秒，空闲超过 5 分钟且当前连接数大于 min-idle 时被回收)
        min-evictable-idle-time-millis: 300000
        # 探测连接是否有效的 SQL 心跳检测语句
        validation-query: SELECT 1
        # 核心检测策略: 空闲时检测连接有效性 (仅在空闲周期触发，借出时不额外执行，兼顾性能与可用性)
        test-while-idle: true
        # 借出连接时不强制执行验证语句 (false 可避免每次申请连接都增加一次网络往返)
        test-on-borrow: false
        # 归还连接时不强制执行验证语句
        test-on-return: false

        # ----------------------------------------------------------------------
        # 连接保活机制 (KeepAlive): 防止网络防火墙或 MySQL 服务端超时断开空闲连接
        # ----------------------------------------------------------------------
        # 开启保活探测
        keep-alive: true
        # 保活探测间隔 (单位: 毫秒，每隔 2 分钟对空闲连接发送心跳验证)
        keep-alive-between-time-millis: 120000

        # ----------------------------------------------------------------------
        # 连接泄漏检测机制（排查工具：设为 false 消除警告并防误杀）
        # ----------------------------------------------------------------------
        remove-abandoned: false
        remove-abandoned-timeout-millis: 180000
        log-abandoned: true

        # ----------------------------------------------------------------------
        # 监控统计与慢 SQL 日志
        # ----------------------------------------------------------------------
        # 启用 Druid 内置统计拦截器 (stat 过滤器)
        filters: stat
        stat:
          # 开启慢 SQL 日志输出
          log-slow-sql: true
          # 慢 SQL 判定阈值 (单位: 毫秒，执行耗时超过 1000ms 的 SQL 将打印 WARN 级别告警)
          slow-sql-millis: 1000

# ------------------------------------------------------------------------------
# 3. 持久层开发配置（开启自动建库方便单机自测）
# ------------------------------------------------------------------------------
aio:
  datasource:
    auto-create-database: true

# ------------------------------------------------------------------------------
# 4. MyBatis-Plus 开发环境 SQL 语句与参数打印配置
# ------------------------------------------------------------------------------
mybatis-plus:
  configuration:
    # 开启标准输出打印: 将预编译 SQL 语句、占位符参数 (?) 以及执行结果总行数直接输出至控制台
    # 便于开发人员在本地快速查看 SQL 执行逻辑与参数绑定是否正确
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ------------------------------------------------------------------------------
# 5. 日志级别配置
# ------------------------------------------------------------------------------
logging:
  level:
    # 开启数据访问层 (Mapper) 的 DEBUG 级别日志输出
    com.zkjs.aio.swap.mapper: debug
