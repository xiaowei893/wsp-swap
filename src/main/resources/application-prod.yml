# ==============================================================================
# wsp-swap 生产环境高可用配置 (Profile: prod)
# 激活方式: 启动参数添加 --spring.profiles.active=prod
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Knife4j / Swagger 接口文档安全控制
# ------------------------------------------------------------------------------
springdoc:
  # 接口文档首页展示标题
  title: "一体化内外网部署数据交换平台"
  # 接口文档项目描述
  description: "交换部署数据处理平台"
  # 接口文档版本号
  version: "1.0.0"
  swagger-ui:
    # 生产环境安全规范: 严禁开放在线 Swagger/Knife4j 页面，防止接口定义与参数结构外泄
    enabled: false
  api-docs:
    # 关闭 OpenAPI 规范元数据端点 (/v3/api-docs)
    enabled: false

# ------------------------------------------------------------------------------
# 2. 数据库连接池配置 (Druid 全局连接池 - 生产高并发调优)
# ------------------------------------------------------------------------------
spring:
  datasource:
    dynamic:
      druid:
        # 初始物理连接数 (生产环境预热创建 10 个连接，避免开机突发流量瞬间打垮数据库)
        initial-size: 10
        # 最小空闲连接数 (高并发下维持较多长连接常驻，消除频繁创建/销毁连接的性能损耗)
        min-idle: 10
        # 最大并发连接数 (生产支持最高 50 个物理并发连接，支撑海量数据交换与并发调度)
        max-active: 50
        # 从连接池借出连接时的最大等待超时时间 (单位: 毫秒，超时将抛出 GetConnectionTimeoutException)
        max-wait: 60000
        # 空闲连接检测与无效连接驱逐线程的运行周期 (单位: 毫秒，每隔 60 秒检测一次)
        time-between-eviction-runs-millis: 60000
        # 连接在池中保持空闲的最少时间 (单位: 毫秒，空闲超过 5 分钟且当前连接数大于 min-idle 时被回收)
        min-evictable-idle-time-millis: 300000
        # 探测连接是否有效的 SQL 心跳检测语句
        validation-query: SELECT 1
        # 核心检测策略: 空闲时检测连接有效性 (仅在空闲周期触发，借出时不额外执行，兼顾性能与可用性)
        test-while-idle: true
        # 借出连接时不强制执行验证语句 (false 可避免每次申请连接都增加一次网络往返)
        test-on-borrow: false
        # 归还连接时不强制执行验证语句
        test-on-return: false

        # ----------------------------------------------------------------------
        # 生产高可用保活机制 (KeepAlive): 防止云上 SLB、硬件防火墙或数据库服务端超时切断空闲连接
        # ----------------------------------------------------------------------
        # 开启保活探测
        keep-alive: true
        # 保活探测间隔 (单位: 毫秒，每隔 2 分钟对空闲连接发送心跳验证)
        keep-alive-between-time-millis: 120000

        # ----------------------------------------------------------------------
        # 连接泄漏检测机制（排查工具：生产环境强烈建议设为 false，防止误杀合法长事务与捕获调用栈性能损耗）
        # ----------------------------------------------------------------------
        remove-abandoned: false                   # 生产环境设为 false，消除 "removeAbandoned is true, not use in production" 警告
        remove-abandoned-timeout-millis: 180000   # 毫秒单位 (180秒)，仅在排查泄漏设为 true 时生效
        log-abandoned: true                       # 仅在开启 remove-abandoned 时打印泄漏代码堆栈

        # ----------------------------------------------------------------------
        # 监控统计与慢 SQL 告警 (生产核心排查手段)
        # ----------------------------------------------------------------------
        # 启用 Druid 内置统计拦截器 (stat 过滤器)
        filters: stat
        stat:
          # 开启慢 SQL 告警日志输出
          log-slow-sql: true
          # 慢 SQL 判定阈值 (单位: 毫秒，执行耗时超过 1000ms 的 SQL 将打印 WARN 级别告警日志)
          slow-sql-millis: 1000

# ------------------------------------------------------------------------------
# 3. 持久层生产安全合规配置 (严禁应用自动建库，由 DBA 或运维统一纳管)
# ------------------------------------------------------------------------------
aio:
  datasource:
    auto-create-database: false

# ------------------------------------------------------------------------------
# 4. 生产环境: 完全关闭 MyBatis-Plus 冗余 SQL 打印
# ------------------------------------------------------------------------------
mybatis-plus:
  configuration:
    # 生产环境显式指定 NoLoggingImpl 静默输出 (或者直接不配置 log-impl 项，采用默认静默机制)
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ------------------------------------------------------------------------------
# 5. 生产环境: 日志级别保持稳健
# ------------------------------------------------------------------------------
logging:
  level:
    # 根日志级别设为 INFO，避免产生海量无用调试信息
    root: info
    # Mapper 包路径保持 INFO 或 WARN，静默普通 SQL 打印
    com.zkjs.aio.swap.mapper: info


